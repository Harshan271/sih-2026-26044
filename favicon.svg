<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sbGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Bridge Connecting Arches (Academia -> Industry) -->
  <path d="M 12 44 Q 32 20 52 44" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="4" stroke-linecap="round" />
  <path d="M 12 44 Q 32 28 52 44" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="3" stroke-linecap="round" />

  <!-- Left Node (Academia Pillar) -->
  <circle cx="16" cy="42" r="4" fill="#ffffff" />
  <!-- Right Node (Industry Gear) -->
  <circle cx="48" cy="42" r="4" fill="#ffffff" />

  <!-- Central Kinetic Lightning Spark (Skill & Innovation) -->
  <polygon points="34,14 24,31 32,31 29,48 42,28 34,28" fill="url(#sparkGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="1" />
</svg>
